#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # 编译
  pre_cmd = [
    # GOMODCACHE 指空目录：禁止 goimports 全量扫描 module cache 建候选包索引（否则 18GB cache 要扫 9s）；
    # 已写明的 import 整理/排序不受影响，只损失「自动补未写 import」的能力（交给编辑器）
    "GOMODCACHE=/tmp/empty-modcache goimports -w .",
    "go vet ./..."
  ]
  cmd = "go build -o ./tmp/main ."
  post_cmd = []
  # 启动
  entrypoint = ["./tmp/main"]
  args_bin = ["--debug", "server", "start"]
  # 防抖(毫秒)
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "runtime"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "js", "css"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
