# golangci-lint v2 配置
# 文档: https://golangci-lint.run/docs/configuration/
# 校验: golangci-lint config verify

version: "2"

linters:
  # standard = errcheck + govet + ineffassign + staticcheck + unused
  default: standard
  # 在默认集之上追加少量高信噪比检查
  enable:
    - misspell   # 拼写错误
    - revive     # golint 继任者，导出符号注释等约定
    - unconvert  # 多余的类型转换
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # 测试代码放宽 errcheck（httptest Close 之类常被有意忽略）
      - path: _test\.go
        linters:
          - errcheck

formatters:
  # golangci-lint fmt 使用的格式化器
  # goimports 与 gci 分工：goimports 负责按符号自动增删 import（fmt 顺手清理），
  # gci 负责强制三段分组——goimports（含 -local）保留已有空行分组、只组内排序，
  # 无法纠正组顺序错乱（如 cube 组排在第三方前），gci 按 sections 完全重写 import 块。
  enable:
    - gofmt
    - goimports
    - gci
  settings:
    goimports:
      local-prefixes:
        - cube
    gci:
      sections:
        - standard
        - default
        - prefix(cube)
